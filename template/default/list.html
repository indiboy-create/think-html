<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <title>{$category.page_title} - {$site.name}</title>
    <meta name="keywords" content="{$category.page_keywords}">
    <meta name="description" content="{$category.page_description}">
</head>
<body>
<h1>{$category.name}</h1>
<ul class="articles">
{volist name="articles" id="a"}
    <li><a href="{$a.url}">{$a.title}</a> <span>{$a.published_text}</span></li>
{/volist}
</ul>
{if condition="$pagination.pages > 1"}
<div class="pagination">
    {if condition="$pagination.prev != ''"}<a href="{$pagination.prev}">上一页</a>{/if}
    <span>{$pagination.page} / {$pagination.pages}</span>
    {if condition="$pagination.next != ''"}<a href="{$pagination.next}">下一页</a>{/if}
</div>
{/if}
</body>
</html>
